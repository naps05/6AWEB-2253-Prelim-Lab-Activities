<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Booksapp</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inconsolata:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Aurora layers -->
  <div class="aurora">
    <div class="aurora-layer aurora-1"></div>
    <div class="aurora-layer aurora-2"></div>
    <div class="aurora-layer aurora-3"></div>
    <div class="aurora-layer aurora-4"></div>
  </div>

  <!-- Moving orbs -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="orb orb-5"></div>
    <div class="orb orb-6"></div>
  </div>

  <!-- Rotating spotlight -->
  <div class="spotlight"></div>
  <div class="spotlight spotlight-2"></div>

  <!-- Light streaks -->
  <div class="streaks">
    <div class="streak streak-1"></div>
    <div class="streak streak-2"></div>
    <div class="streak streak-3"></div>
    <div class="streak streak-4"></div>
    <div class="streak streak-5"></div>
  </div>

  <!-- Fireflies -->
  <div class="fireflies">
    <div class="firefly" style="--x:5%;   --y:15%; --mx:60px;  --my:-40px; --dur:7s;  --dur2:3s;"></div>
    <div class="firefly" style="--x:12%;  --y:55%; --mx:-40px; --my:60px;  --dur:9s;  --dur2:5s;"></div>
    <div class="firefly" style="--x:22%;  --y:30%; --mx:70px;  --my:50px;  --dur:6s;  --dur2:4s;"></div>
    <div class="firefly" style="--x:33%;  --y:70%; --mx:-50px; --my:-30px; --dur:11s; --dur2:6s;"></div>
    <div class="firefly" style="--x:45%;  --y:20%; --mx:40px;  --my:70px;  --dur:8s;  --dur2:3s;"></div>
    <div class="firefly" style="--x:55%;  --y:80%; --mx:-60px; --my:-40px; --dur:10s; --dur2:7s;"></div>
    <div class="firefly" style="--x:63%;  --y:45%; --mx:50px;  --my:-60px; --dur:7s;  --dur2:4s;"></div>
    <div class="firefly" style="--x:72%;  --y:10%; --mx:-30px; --my:80px;  --dur:12s; --dur2:5s;"></div>
    <div class="firefly" style="--x:80%;  --y:65%; --mx:40px;  --my:-50px; --dur:9s;  --dur2:6s;"></div>
    <div class="firefly" style="--x:88%;  --y:35%; --mx:-70px; --my:40px;  --dur:6s;  --dur2:3s;"></div>
    <div class="firefly" style="--x:93%;  --y:75%; --mx:30px;  --my:-70px; --dur:13s; --dur2:7s;"></div>
    <div class="firefly" style="--x:18%;  --y:88%; --mx:80px;  --my:-30px; --dur:8s;  --dur2:4s;"></div>
    <div class="firefly" style="--x:40%;  --y:50%; --mx:-40px; --my:-80px; --dur:7s;  --dur2:5s;"></div>
    <div class="firefly" style="--x:58%;  --y:92%; --mx:60px;  --my:-40px; --dur:10s; --dur2:6s;"></div>
    <div class="firefly" style="--x:76%;  --y:22%; --mx:-50px; --my:60px;  --dur:9s;  --dur2:4s;"></div>
    <div class="firefly" style="--x:96%;  --y:50%; --mx:-80px; --my:30px;  --dur:11s; --dur2:5s;"></div>
    <div class="firefly" style="--x:28%;  --y:5%;  --mx:40px;  --my:90px;  --dur:6s;  --dur2:3s;"></div>
    <div class="firefly" style="--x:50%;  --y:40%; --mx:-60px; --my:50px;  --dur:14s; --dur2:8s;"></div>
    <div class="firefly" style="--x:85%;  --y:90%; --mx:-40px; --my:-60px; --dur:8s;  --dur2:4s;"></div>
    <div class="firefly" style="--x:3%;   --y:70%; --mx:90px;  --my:-20px; --dur:7s;  --dur2:5s;"></div>
  </div>

  <!-- Floating dust particles -->
  <div class="dust">
    <div class="dust-p" style="--x:10%; --dur:20s; --delay:0s;  --size:1px;"></div>
    <div class="dust-p" style="--x:20%; --dur:25s; --delay:3s;  --size:2px;"></div>
    <div class="dust-p" style="--x:30%; --dur:18s; --delay:6s;  --size:1px;"></div>
    <div class="dust-p" style="--x:40%; --dur:22s; --delay:1s;  --size:2px;"></div>
    <div class="dust-p" style="--x:50%; --dur:28s; --delay:4s;  --size:1px;"></div>
    <div class="dust-p" style="--x:60%; --dur:19s; --delay:7s;  --size:2px;"></div>
    <div class="dust-p" style="--x:70%; --dur:24s; --delay:2s;  --size:1px;"></div>
    <div class="dust-p" style="--x:80%; --dur:21s; --delay:5s;  --size:2px;"></div>
    <div class="dust-p" style="--x:90%; --dur:26s; --delay:8s;  --size:1px;"></div>
    <div class="dust-p" style="--x:15%; --dur:23s; --delay:9s;  --size:2px;"></div>
    <div class="dust-p" style="--x:45%; --dur:17s; --delay:2s;  --size:1px;"></div>
    <div class="dust-p" style="--x:75%; --dur:29s; --delay:6s;  --size:2px;"></div>
  </div>

  <app-root></app-root>

</body>
</html>
